name: Check Notebooks Output

# Triggers on every PR so the required `check-notebooks` status always
# reports. The verification steps only run when the PR touches a notebook;
# otherwise the job finishes green after the change check.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**.ipynb"
  workflow_dispatch:

jobs:
  check-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # PRs check out the merge commit; depth 2 brings in its first
          # parent (the base branch tip) so we can diff against it.
          fetch-depth: 2

      - name: Detect notebook changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "notebooks=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: checking all notebooks."
          elif git diff --name-only HEAD^1 HEAD -- '*.ipynb' | grep -q .; then
            echo "notebooks=true" >> "$GITHUB_OUTPUT"
            echo "Notebooks changed in this PR:"
            git diff --name-only HEAD^1 HEAD -- '*.ipynb'
          else
            echo "notebooks=false" >> "$GITHUB_OUTPUT"
            echo "No notebooks changed in this PR: skipping the check."
          fi

      - name: Set up Python
        if: steps.changes.outputs.notebooks == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install nbstripout
        if: steps.changes.outputs.notebooks == 'true'
        run: pip install nbstripout==0.9.1

      - name: Check notebooks are stripped
        if: steps.changes.outputs.notebooks == 'true'
        run: |
          failed=0
          while IFS= read -r -d '' notebook; do
            echo "Checking $notebook..."
            if ! nbstripout --verify "$notebook"; then
              echo "❌ $notebook has output that should be stripped"
              failed=1
            else
              echo "✅ $notebook is properly stripped"
            fi
          done < <(find . -name "*.ipynb" -type f -print0)
          if [ $failed -eq 1 ]; then
            echo "Some notebooks have output. Run: nbstripout <file>"
            exit 1
          fi
          echo "All notebooks are properly stripped! ✅"
