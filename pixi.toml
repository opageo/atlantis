# ============================================================================
# Atlantis — pixi.toml
#
# Alternative setup method using pixi (conda-forge based).
#
# Pixi is only a wrapper for SYSTEM dependencies: GDAL with HDF4 support and the
# binary packages that link against it (rasterio, geopandas, pyproj, shapely).
# pyproject.toml is the single source of truth for every other PyPI dependency;
# pixi installs the project itself and pulls those from PyPI via its extras.
# Never add a pure-Python dependency here — add it to pyproject.toml instead.
#
# Quick start:
#   pixi install          # install default env (GDAL/HDF4 + atlantis + dev)
#   pixi run setup        # bootstrap data assets & credentials
#   pixi run demo         # run Valencia 2024 VIIRS flood example
#
# See docs/pixi-setup.md for the full guide.
# ============================================================================

[workspace]
name = "atlantis"
description = "ML-ready archive of satellite-derived flood inundation observations (ECMWF Code for Earth 2026)"
authors = ["Ioannis Kalfas", "Stelios Lagaras"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

# ============================================================================
# System dependencies: GDAL/HDF4 binary stack + packages built against it
# ============================================================================

[dependencies]
python = ">=3.12,<3.15"

# --- GDAL + HDF4 binary stack (replaces manual build in docs/gdal-install.md) ---
gdal = ">=3.13"
libgdal-hdf4 = "*"
hdf4 = "*"
proj = "*"
geos = "*"

# --- Packages shipped with / compiled against the GDAL, PROJ and GEOS binaries ---
# Unpinned on purpose: version bounds live in pyproject.toml, and pixi's PyPI
# solve validates these conda builds against them.
rasterio = "*"
geopandas = "*"
pyproj = "*"
shapely = "*"
pyarrow = "*"
# Conda picks pandas before the PyPI solve runs, so keep this bound in sync with
# pyproject.toml (pandas < 3).
pandas = "<3"

# ============================================================================
# Editable install of the project itself. Every PyPI dependency comes from
# pyproject.toml ([project].dependencies + the `geo` extra); features below
# add further extras.
# ============================================================================

[pypi-dependencies]
atlantis = { path = ".", editable = true, extras = ["all"] }

# ----------------------------------------------------------------------------
# GDAL is provided by the conda stack above (gdal/libgdal-hdf4). pyproject.toml
# pins gdal==3.13.0 for pure-uv users, but conda-forge resolves a different
# build per platform (e.g. 3.13.3), which pixi then pins for the PyPI solve.
# This override lets pixi's PyPI solve accept whatever GDAL conda installs
# instead of failing on the pin.
# ----------------------------------------------------------------------------
[pypi-options.dependency-overrides]
gdal = ">=3.13"

# ============================================================================
# Feature: dev (development tools)
#
# pixi cannot read PEP 735 [dependency-groups], so the tools from the `dev`
# group of pyproject.toml are installed unpinned here; pyproject.toml remains
# the place for version bounds.
# ============================================================================

[feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-timeout = "*"
pytest-xdist = "*"
pytest-env = "*"
ruff = "*"
vulture = "*"
pre-commit = "*"
ipython = "*"
ipykernel = "*"
nbstripout = "*"
ripgrep = "*"
poethepoet = "*"

# ============================================================================
# Feature: notebooks (Jupyter / ECMWF benchmarking)
# ============================================================================

[feature.notebooks.dependencies]
jupyterlab = "*"

# metview needs the native Metview binary, only packaged for linux-64
[feature.notebooks.target.linux-64.dependencies]
metview-python = "*"

# ============================================================================
# Feature: docs (MkDocs + Material for site generation)
# Mirrors the `docs` dependency group of pyproject.toml (unpinned, see `dev`).
# ============================================================================

[feature.docs.dependencies]
mkdocs-material = "*"
mkdocstrings-python = "*"

# ============================================================================
# Alias features: intentionally empty. All PyPI extras already come from
# `atlantis[all]` in the default [pypi-dependencies]; these exist only so the
# matching environments below can be targeted with `pixi run -e <env>`.
# ============================================================================

[feature.batch]
[feature.events]
[feature.stac]
[feature.ui]
[feature.viz]


# ============================================================================
# Environments
# environments are aliases of default kept for pixi run -e <env>, pixi installs
# all extras from pyproject.toml by default
# ============================================================================

[environments]
default = { features = ["dev", "ui"], solve-group = "default" }
notebooks = { features = ["dev", "notebooks"], solve-group = "default" }
batch = { features = ["dev", "batch"], solve-group = "default" }
events = { features = ["dev", "events"], solve-group = "default" }
ui = { features = ["dev", "ui"], solve-group = "default" }
stac = { features = ["dev", "stac"], solve-group = "default" }
docs = { features = ["dev", "docs"], solve-group = "default" }
viz = { features = ["dev", "viz"], solve-group = "default" }

# ============================================================================
# ============================================================================

[tasks]
setup = " python scripts/setup.py"
docs = { cmd = "mkdocs serve", env = { PYTHONPATH = "src" } }
docs-build = { cmd = "mkdocs build --strict", env = { PYTHONPATH = "src" } }
demo = """ python -m atlantis.cli --verbose fetch \
  --event Valencia_2024 --source viirs \
  --bbox "-1.5 38.8 0.5 40.0" \
  --start-date 2024-10-29 --end-date 2024-11-04 \
  --strategy all --peak-window-days 2 --max-observations 3 --peak-priority balanced \
  --plot --harmonise --no-keep-processed \
  --output ./data/Valencia_2024"""
demo-modis = """ python -m atlantis.cli --verbose fetch \
  --event Valencia_2024 --source modis \
  --bbox "-1.5 38.8 0.5 40.0" \
  --start-date 2024-10-29 --end-date 2024-11-04 \
  --modis-backend laads_hdf4 --modis-composite F2 \
  --strategy all --peak-window-days 2 --max-observations 3 --peak-priority balanced \
  --plot --harmonise --no-keep-processed \
  --output ./data/Valencia_2024"""
demo-gfm = """ python -m atlantis.cli --verbose fetch \
  --event Valencia_2024 --source gfm \
  --bbox "-1.5 38.8 0.5 40.0" \
  --start-date 2024-10-29 --end-date 2024-11-04 \
  --strategy all --peak-window-days 2 --max-observations 3 --peak-priority balanced \
  --plot --harmonise --no-keep-processed \
  --output ./data/Valencia_2024"""
demo-raw = """ python -m atlantis.cli --verbose fetch \
  --event Valencia_2024 --source viirs \
  --bbox "-1.5 38.8 0.5 40.0" \
  --start-date 2024-10-29 --end-date 2024-11-04 \
  --strategy all --peak-window-days 2 --max-observations 3 --peak-priority balanced \
  --no-classify --plot --harmonise --no-keep-processed \
  --output ./data/Valencia_2024"""
demo-modis-raw = """ python -m atlantis.cli --verbose fetch \
  --event Valencia_2024 --source modis \
  --bbox "-1.5 38.8 0.5 40.0" \
  --start-date 2024-10-29 --end-date 2024-11-04 \
  --modis-backend laads_hdf4 --modis-composite F2 \
  --strategy all --peak-window-days 2 --max-observations 3 --peak-priority balanced \
  --no-classify --plot --harmonise --no-keep-processed \
  --output ./data/Valencia_2024"""
demo-gfm-raw = """ python -m atlantis.cli --verbose fetch \
  --event Valencia_2024 --source gfm \
  --bbox "-1.5 38.8 0.5 40.0" \
  --start-date 2024-10-29 --end-date 2024-11-04 \
  --strategy all --peak-window-days 2 --max-observations 3 --peak-priority balanced \
  --no-classify --plot --harmonise --no-keep-processed \
  --output ./data/Valencia_2024"""
test = { cmd = "pytest -n auto tests/ -m 'not slow'", env = { PYTHONPATH = "src" } }
test-all = { cmd = "pytest -n auto tests/", env = { PYTHONPATH = "src" } }
lint = "ruff check ."
lint-fix = "ruff check . --fix"
deadcode = "vulture"
format = "ruff format ."
format-fix = "ruff format ."
precommit = "pre-commit run --all-files"
verify-gdal = """python -c "from osgeo import gdal; assert gdal.GetDriverByName('HDF4'), 'HDF4 driver missing'; print('GDAL', gdal.__version__, '— HDF4 driver: OK')" """
validate-gfm = " python -m atlantis.cli validate-gfm --require-raw"
web = " python -m atlantis.cli web launch --host 0.0.0.0 --port 8080"

# ============================================================================
# Incremental archive updates (atlantis archive {modis,viirs} update)
# ============================================================================

modis-archive-update = " python -m atlantis.cli archive modis update --foreground"
modis-archive-update-dry-run = " python -m atlantis.cli archive modis update --foreground --dry-run"
modis-archive-status = " python -m atlantis.cli archive modis status"
modis-archive-seed-tracker = " python -m atlantis.cli archive modis seed-tracker"

viirs-archive-update = " python -m atlantis.cli archive viirs update --foreground"
viirs-archive-update-dry-run = " python -m atlantis.cli archive viirs update --foreground --dry-run"
viirs-archive-status = " python -m atlantis.cli archive viirs status"
viirs-archive-seed-tracker = " python -m atlantis.cli archive viirs seed-tracker"

# ============================================================================
# Multi-year archive: merge s3://atlantis/zarr/{2016..2025} → zarr/archive + STAC
# ============================================================================

[tasks.merge-yearly-zarr]
cmd = "python scripts/merge_yearly_zarr.py"
default-environment = "stac"

# ============================================================================
# GEOID-Flood event archive (metadata → AOI blocks → GFM cube)
# ============================================================================

[tasks.download-geoidflood-catalog]
cmd = " python scripts/download_geoidflood_catalog.py"
default-environment = "events"

[tasks.estimate-geoidflood-aois]
cmd = " python scripts/estimate_geoidflood_aois.py"
default-environment = "events"

[tasks.estimate-geoidflood-aois-with-items]
cmd = " python scripts/estimate_geoidflood_aois.py --with-items"
default-environment = "events"

[tasks.build-geoidflood-gfm-archive]
cmd = " python scripts/build_geoidflood_gfm_archive.py"
default-environment = "events"

# ============================================================================
# KuroSiwo event archive (catalogue → AOI blocks → GFM cube)
# ============================================================================

[tasks.download-kurosiwo-catalog]
cmd = " python scripts/download_kurosiwo.py"
default-environment = "events"

[tasks.estimate-kurosiwo-aois]
cmd = " python scripts/estimate_kurosiwo_aois.py"
default-environment = "events"

[tasks.estimate-kurosiwo-aois-with-items]
cmd = " python scripts/estimate_kurosiwo_aois.py --with-items"
default-environment = "events"

[tasks.build-kurosiwo-gfm-archive]
cmd = " python scripts/build_kurosiwo_gfm_archive.py"
default-environment = "events"

# ============================================================================
# Per-event GFM backfill into the per-year cubes (s3://atlantis/zarr/{year})
# ============================================================================

[tasks.backfill-geoidflood-gfm]
cmd = " python scripts/build_geoidflood_gfm_archive.py --year {{ year }} --events {{ events }}"
args = [{ arg = "year" }, { arg = "events" }]
default-environment = "events"

[tasks.backfill-kurosiwo-gfm]
cmd = " python scripts/build_kurosiwo_gfm_archive.py --year {{ year }} --events {{ events }}"
args = [{ arg = "year" }, { arg = "events" }]
default-environment = "events"

# ============================================================================
# Custom bbox × date-window GFM archive build (atlantis batch gfm cube run)
# ============================================================================

[tasks.backfill-gfm-bbox]
cmd = "python -m atlantis.cli batch gfm cube run --event {{ event }} --bbox {{ bbox }} --start-date {{ start }} --end-date {{ end }}"
args = [{ arg = "event" }, { arg = "bbox" }, { arg = "start" }, { arg = "end" }]
default-environment = "events"

